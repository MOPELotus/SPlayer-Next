name: TuneWeave Adapter CI

on:
  push:
    branches:
      - agent/tuneweave-native-provider
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuneweave-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/tuneweave-native-provider' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/tuneweave-native-provider

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format account library files
        run: >-
          pnpm prettier --write
          src/apis/account/tuneweaveLibrary.ts
          src/pages/TuneWeaveLibrary.vue

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apis/account/tuneweaveLibrary.ts src/pages/TuneWeaveLibrary.vue
          git commit -m "style: format TuneWeave account library"
          git push origin HEAD:agent/tuneweave-native-provider

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm prettier --check .

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck
        env:
          SKIP_NATIVE_BUILD: true

      - name: Tests
        run: pnpm test
        env:
          SKIP_NATIVE_BUILD: true
